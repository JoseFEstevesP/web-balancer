# centralizar el guardado de los logs
services:
  nginx:
    image: nginx:1.23-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - shared-images:/usr/share/nginx/html/uploads
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_PORT: ${DATABASE_PORT}
    ports:
      - '${DATABASE_PORT}:${DATABASE_PORT}'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
  redis:
    container_name: redis
    image: redis:latest
    ports:
      - '${REDIS_POST}:${REDIS_POST}'
    environment:
      - REDIS_PORT=${REDIS_POST}
    volumes:
      - redis-data:/data
    networks:
      - app-network

  frontend:
    build: ./frontend
    volumes:
      - shared-images:/app/public/uploads
    networks:
      - app-network
    expose:
      - 80

  backend:
    build: ./backend
    volumes:
      - shared-images:/home/app/uploads
    depends_on:
      - db
    networks:
      - app-network

  db-backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    volumes:
      - ./backups:/backups
    environment:
      - TZ=America/Caracas
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - RETENTION_DAYS=${RETENTION_DAYS}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS}
    depends_on:
      - db
    networks:
      - app-network
    restart: always

volumes:
  postgres-data:
  shared-images:
  redis:

networks:
  app-network:
    driver: bridge
